name: Check Schedule

on:
  schedule:
    - cron: '*/8 * * * *'  # Запускати кожні 8 хв
  workflow_dispatch:        # Кнопка для ручного запуску

permissions:
  contents: write

# Забороняє паралельний запуск двох копій бота одночасно
concurrency:
  group: check-schedule-group
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ukr libtesseract-dev

      - name: Install Python Libraries
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: python run_check.py

      - name: Save History
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          if ! git diff --quiet state.json; then
            git add state.json
            git commit -m "chore: update schedule state [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          else
            echo "Змін у state.json немає, пушити не треба."
          fi
